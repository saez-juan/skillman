[tool.poetry]
name = "skillman"
version = "0.1.0"
description = "CLI tool to manage Claude skills"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "skillman", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
click = "^8.0.0"
rich = "^13.0.0"
tomli = {version = "^2.0.0", python = "<3.11"}
tomli-w = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"

[tool.poetry.scripts]
skillman = "skillman.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
